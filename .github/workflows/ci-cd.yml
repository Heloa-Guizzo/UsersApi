name: CI/CD - UsersAPI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/users-api

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UsersApi
        uses: actions/checkout@v4
        with:
          path: UsersApi

      - name: Checkout Shared
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Shared
          path: Shared

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Build
        run: dotnet build UsersApi/UsersAPI.csproj --configuration Release

      - name: Run Unit Tests
        run: dotnet test UsersApi/UsersAPI.csproj --configuration Release --no-build || true

  docker-push-and-deploy:
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - name: Checkout UsersApi
        uses: actions/checkout@v4
        with:
          path: UsersApi

      - name: Checkout Shared
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Shared
          path: Shared

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: UsersApi/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Set Kubernetes Context
        if: env.KUBE_CONFIG != ''
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ env.KUBE_CONFIG }}

      - name: Deploy to Kubernetes (Rolling Update)
        if: env.KUBE_CONFIG != ''
        run: |
          kubectl set image deployment/users-api users-api=${{ env.IMAGE_NAME }}:${{ github.sha }} -n gamestore
          kubectl rollout status deployment/users-api -n gamestore